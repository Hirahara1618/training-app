<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c2025">
<title>筋肉模型</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="model.css" data-inline>
</head>
<body>
<div id="stage"></div>
<header class="top">
  <a class="button back" href="./">← 手帳に戻る</a>
  <h1>筋肉模型</h1>
  <span id="ex-name" class="ex-name"></span>
</header>
<div id="status">読み込み中…</div>
<footer class="bottom">
  <div class="ex-row">
    <select id="ex" aria-label="種目"></select>
  </div>
  <div id="ex-controls" class="ex-row" hidden>
    <button id="play" aria-label="再生・一時停止">❚❚</button>
    <input id="t" type="range" min="0" max="100" value="0" aria-label="動きの位置">
    <button id="path" title="バーの軌道線">軌道</button>
  </div>
  <div id="legend" class="legend" hidden><span class="k main"></span>主に使う <span class="k sub"></span>補助 <span class="k support"></span>支える</div>
  <div id="views">
    <button data-view="front">正面</button>
    <button data-view="oblique">斜め</button>
    <button data-view="side">横</button>
    <button data-view="back">背面</button>
  </div>
  <div class="credit">
    BodyParts3D, Copyright© The Database Center for Life Science licensed by CC Attribution-Share Alike 2.1 Japan.
    加工したデータも同じライセンス（<a href="https://creativecommons.org/licenses/by-sa/2.1/jp/" rel="noopener">CC BY-SA 2.1 JP</a>）で公開しています。
    <br><span id="ver"></span> · <span id="gl-info"></span>
  </div>
</footer>
<div id="fail" hidden>
  <h2 id="fail-title"></h2>
  <p>この画面のスクリーンショットを送ってください。</p>
  <pre id="fail-log"></pre>
  <button id="reload">読み込み直す</button>
</div>

<script>/*__MESH_FILES__*/</script>
<script src="../shared/catalog.js" data-inline></script>
<script src="../app/util.js" data-inline></script>
<script src="math.js" data-inline></script>
<script src="mesh.js" data-inline></script>
<script src="renderer.js" data-inline></script>
<script src="skeleton.js" data-inline></script>
<script src="pose.js" data-inline></script>
<script src="props.js" data-inline></script>
<script src="exercises/common.js" data-inline></script>
<script src="exercises/chest.js" data-inline></script>
<script src="exercises/back.js" data-inline></script>
<script src="exercises/legs.js" data-inline></script>
<script src="model.js" data-inline></script>
<script src="inspect.js" data-inline></script>
</body>
</html>
