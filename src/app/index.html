<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="トレ手帳">
<title>トレーニング手帳</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans+JP:wght@400;600&display=swap">
<link rel="stylesheet" href="app.css" data-inline>
</head>
<body>
<header class="top">
  <nav class="tabs" role="tablist" aria-label="画面">
    <button data-tab="today" role="tab" aria-selected="true">今日</button>
    <button data-tab="muscles" role="tab" aria-selected="false">部位別</button>
    <button data-tab="weight" role="tab" aria-selected="false">体重</button>
    <button data-tab="history" role="tab" aria-selected="false">履歴</button>
    <button data-tab="routine" role="tab" aria-selected="false">ルーティン</button>
  </nav>
</header>
<div id="banner" class="banner" role="alert" hidden></div>
<main>
  <section id="tab-today" role="tabpanel"></section>
  <section id="tab-muscles" role="tabpanel" hidden></section>
  <section id="tab-weight" role="tabpanel" hidden></section>
  <section id="tab-history" role="tabpanel" hidden></section>
  <section id="tab-routine" role="tabpanel" hidden></section>
</main>
<footer class="ver">トレーニング手帳 · 版 __VERSION__</footer>

<div id="savebar" class="bottom-bar" hidden>
  <span id="savebar-msg" class="msg"></span>
  <button data-act="discard">元に戻す</button>
  <button data-act="save" class="primary">変更を保存</button>
</div>
<div id="timer" class="bottom-bar timer" hidden>
  <span class="t-label">休憩</span>
  <span id="timer-left" class="t-left">0:00</span>
  <button data-t="-15">−15秒</button>
  <button data-t="15">＋15秒</button>
  <button data-t="stop">終了</button>
</div>

<script src="../shared/catalog.js" data-inline></script>
<script src="util.js" data-inline></script>
<script src="store.js" data-inline></script>
<script src="logic.js" data-inline></script>
<script src="chart.js" data-inline></script>
<script src="timer.js" data-inline></script>
<script src="today.js" data-inline></script>
<script src="muscles.js" data-inline></script>
<script src="weight.js" data-inline></script>
<script src="history.js" data-inline></script>
<script src="routine.js" data-inline></script>
<script src="app.js" data-inline></script>
</body>
</html>
